name: CodeQL

# Разбор кода самим GitHub: он ищет то, чего не видит ни pyflakes (стиль и
# неиспользованное), ни bandit (список известных опасных вызовов) — путь от
# внешних данных до опасного места. Находки приходят во вкладку Security.
#
# Расписание нужно отдельно от push: база правил обновляется у GitHub, и
# код, чистый в день выкладки, через месяц бывает уже не чистым.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: разбор (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          # security-and-quality шире набора по умолчанию: кроме дыр
          # показывает и ошибки, которые до дыры пока не доросли.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
